    <title>职小搭｜AI 求职工作台</title>
    <script>
      (() => {
        const key = 'job-coach:theme'
        let stored = null
        try { stored = localStorage.getItem(key) } catch (error) { console.warn('无法读取主题偏好', error) }
        const preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
        const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111311' : '#f4f2ec'
      })()
    </script>
