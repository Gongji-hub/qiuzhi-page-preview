<html lang="zh-CN">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="把简历里的经历，变成面试时讲得清的求职资产。" />
    <title>言之｜AI 求职工作台</title>
    <script>
      (() => {
        const key = 'job-coach:theme'
        let stored = null
        try { stored = localStorage.getItem(key) } catch (error) { console.warn('无法读取主题偏好', error) }
        const theme = stored === 'light' || stored === 'dark' ? stored : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#111311' : '#f4f2ec'
      })()
    </script>
